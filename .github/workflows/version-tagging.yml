name: Create Release Tag

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Release Tag

    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'staging' &&
      github.event.pull_request.base.ref == 'master'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          latest_commit_title="$(git log -1 --pretty=%s)"

          echo "Latest commit: ${latest_commit_title}"

          if [[ ! "${latest_commit_title}" =~ ^chore\(release\):\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            echo "::error::Expected latest commit to be a release merge commit. Found: '${latest_commit_title}'"
            exit 1
          fi

          version="${BASH_REMATCH[1]}"

          echo "Release version: ${version}"

          if git rev-parse "${version}" >/dev/null 2>&1; then
            existing_commit="$(git rev-list -n1 "${version}")"
            head_commit="$(git rev-parse HEAD)"

            if [[ "${existing_commit}" == "${head_commit}" ]]; then
              echo "Tag ${version} already exists on current commit."
              exit 0
            fi

            echo "::error::Tag ${version} already exists on a different commit."
            exit 1
          fi

          git tag "${version}"
          git push origin "${version}"

          echo "Created tag ${version}."
